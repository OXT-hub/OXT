<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OXT</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    video, canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    video {
      object-fit: contain;
    }
  </style>
</head>
<body>
  <video
    id="signature"
    autoplay
    muted
    loop
    playsinline
    preload="auto">
    <source src="OXT%20Title%20Signature%20LOTTIE%20INVERT.mp4" type="video/mp4" />
    <source src="OXT%20Title%20Signature%20LOTTIE%20INVERT.webm" type="video/webm" />
  </video>
  <canvas id="stage"></canvas>
  <script>
    // Every frame, paint the whole screen from the video itself: the edges are
    // filled by stretching the frame's corner pixels, then the frame is drawn on
    // top. Edges and video come from the same frame, so the fade always matches.
    (function () {
      var video = document.getElementById('signature');
      var canvas = document.getElementById('stage');
      var ctx = canvas.getContext('2d', { alpha: false });
      var W = 0, H = 0;

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.width = Math.round(window.innerWidth * dpr);
        H = canvas.height = Math.round(window.innerHeight * dpr);
      }

      function draw() {
        var vw = video.videoWidth, vh = video.videoHeight;
        if (!vw || video.readyState < 2) return;
        // Wide screens: fit the whole frame. Tall screens: enlarge so the
        // signature fills the width.
        var scale = W >= H ? Math.min(W / vw, H / vh) : Math.min(1.85 * W / vw, H / vh);
        // Put the centre of the symbol's loops (not the whole frame) at the
        // centre of the screen, and shrink if needed so the stem still fits.
        var cx = vw * 0.5, cy = vh * 0.2884;        // loops centre in the video
        var stemBelow = vh * 0.8833 - cy;           // stem tip distance below it
        scale = Math.min(scale, (H / 2) * 0.94 / stemBelow);
        var dw = vw * scale, dh = vh * scale;
        var dx = W / 2 - cx * scale, dy = H / 2 - cy * scale;
        ctx.drawImage(video, 0, 0, 4, 4, 0, 0, W, H);
        ctx.drawImage(video, dx, dy, dw, dh);
      }

      function loop() {
        draw();
        if (video.requestVideoFrameCallback) {
          video.requestVideoFrameCallback(loop);
        } else {
          requestAnimationFrame(loop);
        }
      }

      resize();
      window.addEventListener('resize', function () { resize(); draw(); });
      video.addEventListener('loadeddata', draw);
      loop();
    })();
  </script>
</body>
</html>
