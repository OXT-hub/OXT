<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OXT</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
    /* On tall/narrow screens, scale the video up so the signature fills the width */
    @media (max-aspect-ratio: 1/1) {
      video {
        width: 185vw;
        height: auto;
        flex-shrink: 0;
      }
    }
  </style>
</head>
<body>
  <video
    id="signature"
    autoplay
    muted
    loop
    playsinline
    preload="auto">
    <source src="OXT%20Title%20Signature%20LOTTIE%20INVERT.mp4" type="video/mp4" />
    <source src="OXT%20Title%20Signature%20LOTTIE%20INVERT.webm" type="video/webm" />
  </video>
  <script>
    // Keep the page background in step with the video's white-to-black invert,
    // so the letterbox space around the video always matches it.
    (function () {
      var video = document.getElementById('signature');
      var canvas = document.createElement('canvas');
      canvas.width = canvas.height = 1;
      var ctx = canvas.getContext('2d', { willReadFrequently: true });
      function sync() {
        if (video.readyState >= 2) {
          try {
            ctx.drawImage(video, 0, 0, 8, 8, 0, 0, 1, 1);
            var p = ctx.getImageData(0, 0, 1, 1).data;
            document.body.style.background = 'rgb(' + p[0] + ',' + p[1] + ',' + p[2] + ')';
          } catch (e) {}
        }
        requestAnimationFrame(sync);
      }
      requestAnimationFrame(sync);
    })();
  </script>
</body>
</html>
